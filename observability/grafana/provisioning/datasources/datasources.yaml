apiVersion: 1

datasources:
  - name: OpsPilot Mimir
    uid: opspilot-mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: false

  - name: OpsPilot Tempo
    uid: opspilot-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToMetrics:
        datasourceUid: opspilot-mimir

  - name: OpsPilot Loki
    uid: opspilot-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
